name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: clickshield_test
          POSTGRES_USER: clickshield_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clickshield_test -d clickshield_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CLICKSHIELD_TEST_DATABASE_URL: postgres://clickshield_test:ci-test-only@localhost:5432/clickshield_test?sslmode=disable
      CLICKSHIELD_TEST_S3_ENDPOINT: http://localhost:9000
      CLICKSHIELD_TEST_S3_ACCESS_KEY: ci-minio-test
      CLICKSHIELD_TEST_S3_SECRET_KEY: ci-minio-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: go mod verify
      - name: Verify encrypted backups
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          make test-backup
      - name: Start isolated S3-compatible storage
        env:
          MINIO_ROOT_USER: ci-minio-test
          MINIO_ROOT_PASSWORD: ci-minio-test-only
        run: |
          mkdir -p "$RUNNER_TEMP/minio-bin" "$RUNNER_TEMP/minio-data"
          GOBIN="$RUNNER_TEMP/minio-bin" go install github.com/minio/minio@RELEASE.2025-04-22T22-12-26Z
          "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 >"$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      - run: make check
      - name: Verify invitation registration in Chromium and WebKit
        run: |
          npx playwright install --with-deps chromium webkit
          CLICKSHIELD_BROWSER_TESTS=1 go test ./internal/httpapi -run TestInviteBrowserRegistration -count=1 -v
      - run: make build
      - name: Verify embedded replay bundles
        run: |
          npm run vendor
          git diff --exit-code -- internal/httpapi/assets/rrweb-record.js internal/httpapi/assets/rrweb-replay.js internal/httpapi/assets/rrweb-replay.css
      - name: Validate Compose examples
        env:
          POSTGRES_PASSWORD: ci-test-only
          ADMIN_PASSWORD: ci-admin-test-only
          SESSION_SECRET: ci-session-secret-at-least-32-bytes
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef'
          BOOTSTRAP_PROJECT_KEY: pk_ci_test
          BOOTSTRAP_ALLOWED_ORIGINS: https://example.test
          OUTCOME_API_TOKEN: ci-outcome-test-only
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
